<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D UI 组件集合</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 标题样式 */
        .page-title {
            text-align: center;
            margin-bottom: 60px;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }
        
        .section-title {
            font-size: 2.5rem;
            margin: 80px 0 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(96, 165, 250, 0.3);
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
        }
        
        /* 3D 文字墙 */
        .word-wall-section {
            margin: 60px 0;
        }
        
        .word-wall-3d {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            transform-style: preserve-3d;
            perspective: 1000px;
            padding: 30px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .word-item-3d {
            background: linear-gradient(145deg, #1e293b, #334155);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .word-item-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .word-item-3d:hover {
            transform: translateY(-10px) translateZ(20px) rotateX(5deg) rotateY(5deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #334155, #475569);
        }
        
        .word-item-3d:hover::before {
            left: 100%;
        }
        
        .word-text {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: block;
        }
        
        .word-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        /* 3D 列表 */
        .list-3d-section {
            margin: 60px 0;
        }
        
        .list-3d {
            max-width: 800px;
            margin: 0 auto;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .list-item-3d {
            background: rgba(30, 41, 59, 0.7);
            margin: 15px 0;
            padding: 20px 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .list-item-3d:hover {
            transform: translateX(20px) translateZ(15px) rotateY(-5deg);
            background: rgba(51, 65, 85, 0.8);
            box-shadow: -10px 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(96, 165, 250, 0.3);
        }
        
        .list-index {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }
        
        .list-content {
            flex: 1;
        }
        
        .list-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #f1f5f9;
        }
        
        .list-description {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        
        .list-badge {
            padding: 5px 15px;
            background: rgba(96, 165, 250, 0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #60a5fa;
        }
        
        /* 3D 菜单 */
        .menu-3d-section {
            margin: 60px 0;
        }
        
        .menu-3d {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            transform-style: preserve-3d;
            perspective: 800px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .menu-item-3d {
            padding: 18px 35px;
            background: linear-gradient(145deg, #1e293b, #334155);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .menu-item-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(167, 139, 250, 0.2));
            border-radius: 50px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .menu-item-3d:hover {
            transform: translateY(-5px) translateZ(20px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        .menu-item-3d:hover::before {
            opacity: 1;
        }
        
        .menu-item-3d.active {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            box-shadow: 0 10px 20px rgba(96, 165, 250, 0.3);
        }
        
        .menu-icon {
            font-size: 1.2rem;
        }
        
        .menu-text {
            font-weight: 600;
            font-size: 1rem;
            position: relative;
            z-index: 1;
        }
        
        /* 3D 卡片 */
        .cards-3d-section {
            margin: 60px 0;
        }
        
        .cards-grid-3d {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .card-3d {
            background: linear-gradient(145deg, #1e293b, #334155);
            border-radius: 20px;
            padding: 30px;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .card-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(96, 165, 250, 0.1) 0%, 
                transparent 30%, 
                transparent 70%, 
                rgba(167, 139, 250, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card-3d:hover {
            transform: translateY(-15px) translateZ(30px) rotateX(5deg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(96, 165, 250, 0.3);
        }
        
        .card-3d:hover::before {
            opacity: 1;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        
        .card-description {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .card-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        /* 3D 表格 */
        .table-3d-section {
            margin: 60px 0;
            overflow: hidden;
        }
        
        .table-3d {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 15px;
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .table-header-3d {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(167, 139, 250, 0.2));
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            font-weight: 600;
            color: #f1f5f9;
        }
        
        .table-row-3d {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }
        
        .table-row-3d:hover {
            background: rgba(51, 65, 85, 0.8);
            transform: translateZ(10px);
        }
        
        .table-cell {
            display: flex;
            align-items: center;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .status-pending {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        /* 3D 进度条 */
        .progress-3d-section {
            margin: 60px 0;
        }
        
        .progress-container-3d {
            max-width: 600px;
            margin: 0 auto;
            transform-style: preserve-3d;
            perspective: 800px;
        }
        
        .progress-item-3d {
            margin: 25px 0;
            position: relative;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .progress-bar-3d {
            height: 20px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            transform: perspective(500px) rotateX(20deg);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 10px;
            position: relative;
            transform-style: preserve-3d;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        
        /* 3D 工具提示 */
        .tooltip-3d {
            position: absolute;
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        .tooltip-3d.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1) translateZ(20px);
        }
        
        .tooltip-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #f1f5f9;
        }
        
        .tooltip-content {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .word-wall-3d {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
                padding: 20px;
            }
            
            .word-item-3d {
                padding: 15px;
            }
            
            .cards-grid-3d {
                grid-template-columns: 1fr;
            }
            
            .menu-3d {
                flex-direction: column;
                align-items: center;
            }
            
            .menu-item-3d {
                width: 100%;
                max-width: 300px;
            }
            
            .table-header-3d,
            .table-row-3d {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
        
        /* 控制面板 */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 200px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .control-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }
        
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(96, 165, 250, 0.4);
        }
        
        .control-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">3D UI 组件集合</h1>
        
        <!-- 3D 文字墙 -->
        <section class="word-wall-section">
            <h2 class="section-title">3D 文字墙</h2>
            <div class="word-wall-3d" id="wordWall3D">
                <!-- 文字墙内容将通过JS动态生成 -->
            </div>
        </section>
        
        <!-- 3D 列表 -->
        <section class="list-3d-section">
            <h2 class="section-title">3D 列表</h2>
            <div class="list-3d" id="list3D">
                <!-- 列表内容将通过JS动态生成 -->
            </div>
        </section>
        
        <!-- 3D 菜单 -->
        <section class="menu-3d-section">
            <h2 class="section-title">3D 菜单</h2>
            <div class="menu-3d" id="menu3D">
                <!-- 菜单内容将通过JS动态生成 -->
            </div>
        </section>
        
        <!-- 3D 卡片 -->
        <section class="cards-3d-section">
            <h2 class="section-title">3D 卡片</h2>
            <div class="cards-grid-3d" id="cardsGrid3D">
                <!-- 卡片内容将通过JS动态生成 -->
            </div>
        </section>
        
        <!-- 3D 表格 -->
        <section class="table-3d-section">
            <h2 class="section-title">3D 表格</h2>
            <div class="table-3d" id="table3D">
                <!-- 表格内容将通过JS动态生成 -->
            </div>
        </section>
        
        <!-- 3D 进度条 -->
        <section class="progress-3d-section">
            <h2 class="section-title">3D 进度条</h2>
            <div class="progress-container-3d" id="progress3D">
                <!-- 进度条内容将通过JS动态生成 -->
            </div>
        </section>
    </div>
    
    <!-- 控制面板 -->
    <div class="controls">
        <div class="control-group">
            <label class="control-label">3D 深度: <span id="depthValue">1.0</span></label>
            <input type="range" min="0.5" max="2" step="0.1" value="1" class="control-slider" id="depthSlider">
        </div>
        
        <div class="control-group">
            <label class="control-label">动画速度: <span id="speedValue">1.0</span>x</label>
            <input type="range" min="0.5" max="2" step="0.1" value="1" class="control-slider" id="speedSlider">
        </div>
        
        <div class="control-group">
            <button class="control-btn" id="resetBtn">重置所有动画</button>
        </div>
        
        <div class="control-group">
            <button class="control-btn" id="toggleBtn">切换自动动画</button>
        </div>
    </div>
    
    <!-- 3D 工具提示 -->
    <div class="tooltip-3d" id="tooltip3D">
        <div class="tooltip-title" id="tooltipTitle">工具提示标题</div>
        <div class="tooltip-content" id="tooltipContent">工具提示内容</div>
    </div>

    <script>
        // 注册 GSAP 插件
        gsap.registerPlugin(ScrollTrigger);
        
        // 全局变量
        let globalDepth = 1.0;
        let globalSpeed = 1.0;
        let autoAnimation = true;
        let tooltipTimeout;
        
        // 初始化函数
        function init3DUI() {
            initWordWall();
            initList3D();
            initMenu3D();
            initCards3D();
            initTable3D();
            initProgress3D();
            initControls();
            initScrollAnimations();
            initTooltips();
        }
        
        // 3D 文字墙
        function initWordWall() {
            const wordWall = document.getElementById('wordWall3D');
            const words = [
                { text: 'HTML5', subtitle: '标记语言' },
                { text: 'CSS3', subtitle: '样式表' },
                { text: 'JavaScript', subtitle: '编程语言' },
                { text: 'React', subtitle: 'UI框架' },
                { text: 'Vue.js', subtitle: '渐进式框架' },
                { text: 'Angular', subtitle: '完整框架' },
                { text: 'TypeScript', subtitle: '类型安全' },
                { text: 'Node.js', subtitle: '后端运行' },
                { text: 'Python', subtitle: '通用语言' },
                { text: 'Java', subtitle: '企业级' },
                { text: 'C++', subtitle: '高性能' },
                { text: 'Go', subtitle: '并发编程' },
                { text: 'Rust', subtitle: '内存安全' },
                { text: 'Swift', subtitle: '苹果开发' },
                { text: 'Kotlin', subtitle: '安卓开发' },
                { text: 'Dart', subtitle: 'Flutter' }
            ];
            
            words.forEach((word, index) => {
                const wordItem = document.createElement('div');
                wordItem.className = 'word-item-3d';
                wordItem.innerHTML = `
                    <span class="word-text">${word.text}</span>
                    <span class="word-subtitle">${word.subtitle}</span>
                `;
                
                // 设置初始3D变换
                const x = (index % 4 - 1.5) * 5;
                const y = Math.floor(index / 4 - 1) * 5;
                gsap.set(wordItem, {
                    rotationX: -10,
                    rotationY: x,
                    z: y * 2,
                    opacity: 0
                });
                
                wordWall.appendChild(wordItem);
                
                // 鼠标悬停效果
                wordItem.addEventListener('mouseenter', () => {
                    gsap.to(wordItem, {
                        duration: 0.3,
                        scale: 1.1,
                        rotationX: 0,
                        rotationY: 0,
                        z: 30 * globalDepth,
                        ease: "back.out(1.7)"
                    });
                    
                    showTooltip(wordItem, word.text, `这是一个关于${word.text}的示例，${word.subtitle}`);
                });
                
                wordItem.addEventListener('mouseleave', () => {
                    gsap.to(wordItem, {
                        duration: 0.3,
                        scale: 1,
                        rotationX: -10,
                        rotationY: x,
                        z: y * 2,
                        ease: "power2.out"
                    });
                    
                    hideTooltip();
                });
                
                // 点击事件
                wordItem.addEventListener('click', () => {
                    gsap.to(wordItem, {
                        duration: 0.2,
                        scale: 0.95,
                        ease: "power2.in",
                        onComplete: () => {
                            gsap.to(wordItem, {
                                duration: 0.3,
                                scale: 1,
                                ease: "back.out(1.7)"
                            });
                        }
                    });
                    
                    console.log(`点击了: ${word.text}`);
                });
            });
            
            // 文字墙入场动画
            gsap.to('.word-item-3d', {
                duration: 1,
                opacity: 1,

        // 3D 菜单
        function initMenu3D() {
            const menu3D = document.getElementById('menu3D');
            const menuItems = [
                { icon: '🏠', text: '首页' },
                { icon: '📱', text: '产品' },
                { icon: '💼', text: '服务' },
                { icon: '📚', text: '文档' },
                { icon: '👥', text: '团队' },
                { icon: '📞', text: '联系' }
            ];
            
            menuItems.forEach((item, index) => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item-3d';
                if (index === 0) menuItem.classList.add('active');
                menuItem.innerHTML = `
                    <span class="menu-icon">${item.icon}</span>
                    <span class="menu-text">${item.text}</span>
                `;
                
                // 设置初始状态
                gsap.set(menuItem, {
                    y: 50,
                    opacity: 0,
                    rotationY: index % 2 === 0 ? -30 : 30
                });
                
                menu3D.appendChild(menuItem);
                
                // 点击事件
                menuItem.addEventListener('click', () => {
                    // 移除其他菜单项的激活状态
                    document.querySelectorAll('.menu-item-3d').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // 添加当前激活状态
                    menuItem.classList.add('active');
                    
                    // 点击动画
                    gsap.to(menuItem, {
                        duration: 0.2,
                        scale: 0.95,
                        ease: "power2.in",
                        onComplete: () => {
                            gsap.to(menuItem, {
                                duration: 0.3,
                                scale: 1,
                                ease: "back.out(1.7)"
                            });
                        }
                    });
                    
                    console.log(`选择了: ${item.text}`);
                });
            });
            
            // 菜单入场动画
            gsap.to('.menu-item-3d', {
                duration: 0.8,
                y: 0,
                opacity: 1,
                rotationY: 0,
                stagger: 0.1,
                ease: "back.out(1.7)",
                scrollTrigger: {
                    trigger: '.menu-3d-section',
                    start: 'top 80%'
                }
            });
        }

        // 3D 表格
        function initTable3D() {

        // 3D 进度条
        function initProgress3D() {
            const progress3D = document.getElementById('progress3D');
            const progressData = [
                { label: '前端开发', value: 85 },
                { label: '后端开发', value: 60 },
                { label: 'UI设计', value: 95 },
                { label: '测试部署', value: 40 }
            ];
            
            progressData.forEach((item, index) => {
                const progressItem = document.createElement('div');
                progressItem.className = 'progress-item-3d';
                progressItem.innerHTML = `
                    <div class="progress-label">
                        <span>${item.label}</span>
                        <span>${item.value}%</span>
                    </div>
                    <div class="progress-bar-3d">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                `;
                
                progress3D.appendChild(progressItem);
                
                // 延迟设置进度
                setTimeout(() => {
                    const fill = progressItem.querySelector('.progress-fill');
                    gsap.to(fill, {
                        duration: 2,
                        width: `${item.value}%`,
                        ease: "power3.out",
                        delay: index * 0.3
                    });
                }, 500);
            });
        }
        
        // 工具提示
        function initTooltips() {
            const tooltip = document.getElementById('tooltip3D');
            
            // 鼠标移动时更新工具提示位置
            document.addEventListener('mousemove', (e) => {
                gsap.to(tooltip, {
                    duration: 0.1,
                    x: e.clientX + 15,
                    y: e.clientY + 15
                });
            });
        }
        
        function showTooltip(element, title, content) {
            const tooltip = document.getElementById('tooltip3D');
            const tooltipTitle = document.getElementById('tooltipTitle');
            const tooltipContent = document.getElementById('tooltipContent');
            
            tooltipTitle.textContent = title;
            tooltipContent.textContent = content;
            
            // 清除之前的定时器
            if (tooltipTimeout) clearTimeout(tooltipTimeout);
            
            // 显示工具提示
            tooltip.classList.add('active');
            
            // 设置自动隐藏
            tooltipTimeout = setTimeout(() => {
                hideTooltip();
            }, 3000);
        }
        
        function hideTooltip() {
            const tooltip = document.getElementById('tooltip3D');
            tooltip.classList.remove('active');
        }
        
        // 控制面板
        function initControls() {
            const depthSlider = document.getElementById('depthSlider');
            const speedSlider = document.getElementById('speedSlider');
            const depthValue = document.getElementById('depthValue');
            const speedValue = document.getElementById('speedValue');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            
            // 深度控制
            depthSlider.addEventListener('input', (e) => {
                globalDepth = parseFloat(e.target.value);
                depthValue.textContent = globalDepth.toFixed(1);
                updateAll3DDepth();
            });
            
            // 速度控制
            speedSlider.addEventListener('input', (e) => {
                globalSpeed = parseFloat(e.target.value);
                speedValue.textContent = globalSpeed.toFixed(1);
                gsap.globalTimeScale(globalSpeed);
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', () => {
                ScrollTrigger.getAll().forEach(trigger => trigger.kill());
                initScrollAnimations();
                gsap.globalTimeScale(1);
                speedSlider.value = 1;
                speedValue.textContent = '1.0';
                globalSpeed = 1;
                
                // 重置进度条
                document.querySelectorAll('.progress-fill').forEach(fill => {
                    gsap.set(fill, { width: '0%' });
                    const parent = fill.parentElement.parentElement;
                    const value = parseInt(parent.querySelector('.progress-label span:last-child').textContent);
                    gsap.to(fill, {
                        duration: 2,
                        width: `${value}%`,
                        ease: "power3.out"
                    });
                });
            });
            
            // 切换自动动画
            toggleBtn.addEventListener('click', () => {
                autoAnimation = !autoAnimation;
                toggleBtn.textContent = autoAnimation ? '关闭自动动画' : '开启自动动画';
                
                // 控制卡片浮动动画
                document.querySelectorAll('.card-3d').forEach((card, index) => {
                    if (autoAnimation) {
                        gsap.to(card, {
                            duration: 3 + index,
                            y: -10,
                            ease: "sine.inOut",
                            repeat: -1,
                            yoyo: true
                        });
                    } else {
                        gsap.killTweensOf(card);
                        gsap.to(card, {
                            duration: 0.5,
                            y: 0,
                            ease: "power2.out"
                        });
                    }
                });
            });
        }
        
        // 更新所有3D深度
        function updateAll3DDepth() {
            // 更新文字墙
            document.querySelectorAll('.word-item-3d').forEach((item, index) => {
                const x = (index % 4 - 1.5) * 5 * globalDepth;
                const y = Math.floor(index / 4 - 1) * 5 * globalDepth;
                gsap.set(item, {
                    rotationY: x,
                    z: y * 2
                });
            });
            
            // 更新菜单项的悬停效果
            document.querySelectorAll('.menu-item-3d').forEach(item => {
                item.style.setProperty('--hover-depth', `${20 * globalDepth}px`);
            });
            
            // 更新卡片的悬停效果
            document.querySelectorAll('.card-3d').forEach(item => {
                item.style.setProperty('--hover-depth', `${30 * globalDepth}px`);
            });
        }
        
        // 滚动动画
        function initScrollAnimations() {
            // 每个部分的入场动画
            const sections = document.querySelectorAll('section');
            
            sections.forEach((section, index) => {
                gsap.from(section, {
                    scrollTrigger: {
                        trigger: section,
                        start: 'top 80%',
                        end: 'bottom 20%',
                        toggleActions: 'play none none reverse'
                    },
                    duration: 1,
                    y: 50,
                    opacity: 0,
                    ease: "power3.out",
                    delay: index * 0.1
                });
            });
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init3DUI);

        console.log('🎮 3D UI 组件集合已加载');

        console.log('   5. 3D 表格 - 数据表格，行悬停效果');
        console.log('   6. 3D 进度条 - 动态进度，3D透视');
        console.log('');
        console.log('⚙️ 控制面板功能：');
        console.log('   • 3D深度: 控制3D效果的强度');
        console.log('   • 动画速度: 调整整体动画速度');
        console.log('   • 重置: 重置所有动画到初始状态');
        console.log('   • 自动动画: 开关卡片的浮动动画');
    </script>
