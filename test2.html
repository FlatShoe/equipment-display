<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浅灰房间框架3D大屏</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #efefef;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #efefef;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        color: #333;
      }

      .loader {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top: 3px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .info-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 20px;
        color: #333;
        z-index: 10;
        max-width: 300px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .info-panel h1 {
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 600;
        color: #3498db;
      }

      .info-panel p {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.8;
      }

      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      .control-btn {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(0, 0, 0, 0.1);
        color: #555;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.3s;
        backdrop-filter: blur(10px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      .control-btn:hover {
        background: rgba(52, 152, 219, 0.2);
        color: #3498db;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .control-btn.active {
        background: rgba(52, 152, 219, 0.3);
        border-color: rgba(52, 152, 219, 0.4);
        color: #3498db;
      }

      .screen-label {
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        padding: 8px 16px;
        border-radius: 8px;
        color: #333;
        font-size: 12px;
        font-weight: 500;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        white-space: nowrap;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .stats {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 15px;
        color: #333;
        z-index: 10;
        font-size: 12px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">
      <div class="loader"></div>
      <p id="loading-text" style="color: #666">初始化中...</p>
    </div>

    <!-- 使用最新稳定版本的Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

    <script>
      // 全局变量
      let scene, camera, renderer, cssRenderer, controls
      let screens = []
      let frameCount = 0
      let lastTime = performance.now()
      let fps = 0

      // 屏幕配置
      const screenConfigs = [
        {
          title: '主屏幕 - 交换机监控',
          url: 'http://127.0.0.1:5501/test.html',
          size: {width: 1400, height: 900},
          position: {x: 0, y: 100, z: -1500},
          rotation: {x: 0, y: 0, z: 0},
          hoverScale: 1.05
        },
        {
          title: '副屏 - 百度地图',
          url: 'https://map.baidu.com',
          size: {width: 1000, height: 700},
          position: {x: -1200, y: 300, z: -1200},
          rotation: {x: 0, y: 0.3, z: 0},
          hoverScale: 1.05
        },
        {
          title: '数据屏 - 百度新闻',
          url: 'https://news.baidu.com',
          size: {width: 800, height: 500},
          position: {x: 1000, y: -100, z: -1300},
          rotation: {x: 0, y: -0.3, z: 0},
          hoverScale: 1.05
        },
        {
          title: '监控屏 - 百度图片',
          url: 'https://image.baidu.com',
          size: {width: 600, height: 400},
          position: {x: 0, y: -300, z: -1000},
          rotation: {x: 0.3, y: 0, z: 0},
          hoverScale: 1.05
        }
      ]

      // 视图预设
      const viewPresets = [
        {
          position: {x: 0, y: 0, z: 1200},
          target: {x: 0, y: 0, z: -1000},
          label: '主视角'
        },
        {
          position: {x: 0, y: 1500, z: 0},
          target: {x: 0, y: 0, z: -1000},
          label: '俯视'
        },
        {
          position: {x: 1500, y: 0, z: 0},
          target: {x: 0, y: 0, z: -1000},
          label: '侧视'
        }
      ]

      // 更新加载状态
      function updateLoadingText(text) {
        const loadingText = document.getElementById('loading-text')
        if (loadingText) {
          loadingText.textContent = text
        }
      }

      // 初始化Three.js
      async function init() {
        try {
          updateLoadingText('检查Three.js加载...')

          if (typeof THREE === 'undefined') {
            throw new Error('Three.js 库加载失败')
          }

          updateLoadingText('初始化场景...')

          // 创建场景
          scene = new THREE.Scene()
          // 设置RGB(239, 239, 239)背景色
          scene.background = new THREE.Color(0xefefef) // 十六进制#EFEFEF
          // 调整雾效为相同颜色
          scene.fog = new THREE.Fog(0xefefef, 1000, 5000)

          // 创建相机
          camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000)
          camera.position.set(
            viewPresets[0].position.x,
            viewPresets[0].position.y,
            viewPresets[0].position.z
          )

          updateLoadingText('创建WebGL渲染器...')

          // 创建WebGL渲染器
          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
          })
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
          renderer.setSize(window.innerWidth, window.innerHeight)
          renderer.outputEncoding = THREE.sRGBEncoding
          renderer.toneMapping = THREE.ACESFilmicToneMapping
          renderer.toneMappingExposure = 1.0
          document.body.appendChild(renderer.domElement)

          updateLoadingText('创建CSS3D渲染器...')

          // 创建CSS3D渲染器
          if (typeof THREE.CSS3DRenderer !== 'undefined') {
            cssRenderer = new THREE.CSS3DRenderer()
            cssRenderer.setSize(window.innerWidth, window.innerHeight)
            cssRenderer.domElement.style.position = 'fixed'
            cssRenderer.domElement.style.top = '0'
            cssRenderer.domElement.style.left = '0'
            cssRenderer.domElement.style.pointerEvents = 'none'
            document.body.appendChild(cssRenderer.domElement)
          }

          updateLoadingText('添加控制器...')

          // 添加轨道控制器
          if (typeof THREE.OrbitControls !== 'undefined') {
            controls = new THREE.OrbitControls(camera, renderer.domElement)
            controls.target.set(
              viewPresets[0].target.x,
              viewPresets[0].target.y,
              viewPresets[0].target.z
            )
            controls.enableDamping = true
            controls.dampingFactor = 0.05
            controls.minDistance = 300
            controls.maxDistance = 5000
          }

          updateLoadingText('创建房间框架...')

          // 创建房间框架
          createRoomFrame()

          updateLoadingText('创建无边框屏幕...')

          // 创建无边框屏幕
          createBorderlessScreens()

          updateLoadingText('启动动画循环...')

          // 启动动画循环
          animate()

          // 隐藏加载界面
          setTimeout(() => {
            const loading = document.getElementById('loading')
            loading.style.opacity = '0'
            setTimeout(() => {
              loading.style.display = 'none'
            }, 500)
          }, 1000)

          // 事件监听
          window.addEventListener('resize', onWindowResize)

          console.log('✅ 浅灰房间框架3D空间初始化完成')
        } catch (error) {
          console.error('初始化失败:', error)
          updateLoadingText('初始化失败: ' + error.message)
          document.getElementById('loading').innerHTML = `
                    <h2 style="color: #e74c3c;">加载失败</h2>
                    <p>${error.message}</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 500;">
                        重新加载
                    </button>
                `
        }
      }

      // 创建房间框架
      function createRoomFrame() {
        const roomWidth = 5000
        const roomHeight = 3000
        const roomDepth = 5000

        const lineColor = 0xaaaaaa
        const lineOpacity = 0.4
        const lineWidth = 1

        // 创建材质
        const lineMaterial = new THREE.LineBasicMaterial({
          color: lineColor,
          transparent: true,
          opacity: lineOpacity,
          linewidth: lineWidth
        })

        // 创建房间的12条边
        const edges = []

        // 定义房间的8个顶点
        const vertices = [
          // 地板顶点
          new THREE.Vector3(-roomWidth / 2, -roomHeight / 2, -roomDepth / 2), // 0: 左后下
          new THREE.Vector3(roomWidth / 2, -roomHeight / 2, -roomDepth / 2), // 1: 右后下
          new THREE.Vector3(roomWidth / 2, -roomHeight / 2, roomDepth / 2), // 2: 右前下
          new THREE.Vector3(-roomWidth / 2, -roomHeight / 2, roomDepth / 2), // 3: 左前下

          // 天花板顶点
          new THREE.Vector3(-roomWidth / 2, roomHeight / 2, -roomDepth / 2), // 4: 左后上
          new THREE.Vector3(roomWidth / 2, roomHeight / 2, -roomDepth / 2), // 5: 右后上
          new THREE.Vector3(roomWidth / 2, roomHeight / 2, roomDepth / 2), // 6: 右前上
          new THREE.Vector3(-roomWidth / 2, roomHeight / 2, roomDepth / 2) // 7: 左前上
        ]

        // 定义12条边
        const edgesIndices = [
          // 地板
          [0, 1],
          [1, 2],
          [2, 3],
          [3, 0],
          // 天花板
          [4, 5],
          [5, 6],
          [6, 7],
          [7, 4],
          // 垂直线
          [0, 4],
          [1, 5],
          [2, 6],
          [3, 7]
        ]

        // 创建所有边
        edgesIndices.forEach(indices => {
          const geometry = new THREE.BufferGeometry().setFromPoints([
            vertices[indices[0]],
            vertices[indices[1]]
          ])
          const line = new THREE.Line(geometry, lineMaterial)
          scene.add(line)
          edges.push(line)
        })

        // 添加简单的网格地板
        const floorGridSize = roomWidth
        const floorDivisions = 20
        const floorGrid = new THREE.GridHelper(floorGridSize, floorDivisions, 0xcccccc, 0xdddddd)
        floorGrid.material.opacity = 0.1
        floorGrid.material.transparent = true
        floorGrid.position.y = -roomHeight / 2
        scene.add(floorGrid)

        // 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5)
        scene.add(ambientLight)

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6)
        directionalLight1.position.set(roomWidth, roomHeight, -roomDepth)
        scene.add(directionalLight1)

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3)
        directionalLight2.position.set(-roomWidth, roomHeight / 2, roomDepth)
        scene.add(directionalLight2)
      }

      // 创建无边框屏幕
      function createBorderlessScreens() {
        screenConfigs.forEach((config, index) => {
          createScreen(config, index)
        })
      }

      // 创建单个无边框屏幕
      function createScreen(config, index) {
        const {width, height} = config.size

        // 创建屏幕组
        const screenGroup = new THREE.Group()

        // 创建CSS3D内容
        if (cssRenderer) {
          // 创建iframe容器 - 去掉所有边框和阴影
          const iframeContainer = document.createElement('div')
          iframeContainer.style.width = width + 'px'
          iframeContainer.style.height = height + 'px'
          iframeContainer.style.borderRadius = '0px'
          iframeContainer.style.overflow = 'hidden'
          iframeContainer.style.boxShadow = 'none' // 去掉阴影
          iframeContainer.style.transition = 'transform 0.3s ease'
          iframeContainer.style.willChange = 'transform'
          iframeContainer.style.border = 'none' // 去掉边框

          // 创建iframe
          const iframe = document.createElement('iframe')
          iframe.style.width = '100%'
          iframe.style.height = '100%'
          iframe.style.border = 'none'
          iframe.src = config.url
          iframe.title = config.title
          iframe.allow =
            'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'
          iframe.allowFullscreen = true
          iframe.sandbox =
            'allow-same-origin allow-scripts allow-popups allow-forms allow-presentation'

          iframeContainer.appendChild(iframe)

          // 创建屏幕标签
          const labelDiv = document.createElement('div')
          labelDiv.className = 'screen-label'
          labelDiv.textContent = config.title
          labelDiv.style.transform = `translateY(${height / 2 + 30}px)`
          iframeContainer.appendChild(labelDiv)

          // 添加悬停事件 - 去掉所有边框和阴影效果
          iframeContainer.addEventListener('mouseenter', () => {
            labelDiv.style.opacity = '1'

            // 保存当前变换状态
            screenGroup.userData.isHovered = true
            screenGroup.userData.targetScale = config.hoverScale || 1.05
          })

          iframeContainer.addEventListener('mouseleave', () => {
            labelDiv.style.opacity = '0'

            // 恢复状态
            screenGroup.userData.isHovered = false
            screenGroup.userData.targetScale = 1
          })

          const cssObject = new THREE.CSS3DObject(iframeContainer)
          screenGroup.add(cssObject)

          screenGroup.userData.cssObject = cssObject
          screenGroup.userData.container = iframeContainer
          screenGroup.userData.label = labelDiv
          screenGroup.userData.iframe = iframe
          screenGroup.userData.config = config
          screenGroup.userData.currentScale = 1
          screenGroup.userData.targetScale = 1
        }

        // 设置位置和旋转
        screenGroup.position.set(config.position.x, config.position.y, config.position.z)
        screenGroup.rotation.set(config.rotation.x, config.rotation.y, config.rotation.z)

        // 让屏幕朝向观察者
        const lookAtPoint = new THREE.Vector3(0, 0, 1000)
        screenGroup.lookAt(lookAtPoint)

        scene.add(screenGroup)

        screens.push({
          group: screenGroup,
          config: config
        })
      }

      // 窗口大小调整处理
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()

        renderer.setSize(window.innerWidth, window.innerHeight)

        if (cssRenderer) {
          cssRenderer.setSize(window.innerWidth, window.innerHeight)
        }
      }

      // 动画循环
      function animate(time) {
        requestAnimationFrame(animate)

        // 计算FPS
        frameCount++
        const currentTime = performance.now()
        if (currentTime >= lastTime + 1000) {
          fps = Math.round((frameCount * 1000) / (currentTime - lastTime))
          frameCount = 0
          lastTime = currentTime
        }

        // 更新控制器
        if (controls) {
          controls.update()
        }

        // 更新屏幕悬停动画
        screens.forEach(screen => {
          const group = screen.group
          if (group.userData) {
            // 平滑缩放动画
            const scaleDiff = (group.userData.targetScale - group.userData.currentScale) * 0.1
            group.userData.currentScale += scaleDiff

            if (group.userData.cssObject) {
              // 应用缩放
              const scale = group.userData.currentScale
              group.userData.cssObject.scale.set(scale, scale, scale)
            }

            // 如果有悬浮效果，可以添加轻微浮动动画
            if (Math.abs(scaleDiff) > 0.001 && group.userData.isHovered) {
              const floatOffset = Math.sin(time * 0.001) * 3
              group.userData.cssObject.position.y = floatOffset
            } else if (!group.userData.isHovered) {
              group.userData.cssObject.position.y = 0
            }
          }
        })

        // 渲染场景
        renderer.render(scene, camera)

        if (cssRenderer) {
          cssRenderer.render(scene, camera)
        }
      }

      // 缓动函数
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3)
      }

      // 页面加载完成后初始化
      window.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 开始初始化浅灰房间框架3D空间...')
        init()
      })

      // 处理页面卸载
      window.addEventListener('beforeunload', () => {
        if (renderer) {
          renderer.dispose()
        }
      })

      class ModelLoader {
        constructor(scene, camera, renderer) {
          this.scene = scene
          this.camera = camera
          this.renderer = renderer
          this.model = null
          this.isDragging = false
          this.previousMousePosition = {x: 0, y: 0}
          this.controls = null

          // 绑定方法
          this.load = this.load.bind(this)
          this.loadFromFile = this.loadFromFile.bind(this)
          this.updatePosition = this.updatePosition.bind(this)
          this.updateRotation = this.updateRotation.bind(this)
          this.updateScale = this.updateScale.bind(this)
          this.reset = this.reset.bind(this)
          this.remove = this.remove.bind(this)
          this.onMouseDown = this.onMouseDown.bind(this)
          this.onMouseMove = this.onMouseMove.bind(this)
          this.onMouseUp = this.onMouseUp.bind(this)

          // 初始化事件监听
          this.initEventListeners()
        }

        initEventListeners() {
          if (this.renderer && this.renderer.domElement) {
            this.renderer.domElement.addEventListener('mousedown', this.onMouseDown)
            this.renderer.domElement.addEventListener('mousemove', this.onMouseMove)
            this.renderer.domElement.addEventListener('mouseup', this.onMouseUp)
          }
        }

        async load(url = 'http://localhost:9601/models/yyp.glb') {
          return new Promise((resolve, reject) => {
            if (!this.scene) {
              reject(new Error('场景未初始化，无法加载模型'))
              return
            }

            // 如果已存在模型，先移除
            if (this.model) {
              this.remove()
            }

            // 更新加载状态
            this.updateLoadingState('正在加载模型...', '加载中...')

            // 创建GLTF加载器
            const loader = new THREE.GLTFLoader()

            loader.load(
              url,
              // 加载成功回调
              gltf => {
                this.model = gltf.scene

                // 设置模型初始位置和缩放
                this.model.position.set(0, 0, 0)
                this.model.rotation.set(0, 0, 0)
                this.model.scale.set(1, 1, 1)

                // 添加到场景
                this.scene.add(this.model)

                // 更新UI状态
                this.updateLoadingState('模型加载完成', '已加载')
                this.showControls()
                this.updateControlValues()

                console.log('✅ 模型加载成功')
                resolve(this.model)
              },
              // 加载进度回调
              xhr => {
                const percent = ((xhr.loaded / xhr.total) * 100).toFixed(2)
                this.updateLoadingState(`加载模型中... ${percent}%`, '加载中...')
              },
              // 加载失败回调
              error => {
                console.error('❌ 模型加载失败:', error)
                this.updateLoadingState('模型加载失败: ' + error.message, '加载失败')
                reject(error)
              }
            )
          })
        }

        async loadFromFile(file) {
          return new Promise((resolve, reject) => {
            if (!file) {
              reject(new Error('没有选择文件'))
              return
            }

            const url = URL.createObjectURL(file)
            this.load(url).then(resolve).catch(reject)
          })
        }

        updatePosition(x, y, z) {
          if (!this.model) return

          this.model.position.set(x, y, z)
          this.updateControlValues()
        }

        updateRotation(x, y, z) {
          if (!this.model) return

          // 转换为弧度
          const radX = (x * Math.PI) / 180
          const radY = (y * Math.PI) / 180
          const radZ = (z * Math.PI) / 180

          this.model.rotation.set(radX, radY, radZ)
          this.updateControlValues()
        }

        updateScale(scale) {
          if (!this.model) return

          this.model.scale.set(scale, scale, scale)
          this.updateControlValues()
        }

        reset() {
          if (!this.model) return

          this.model.position.set(0, 0, 0)
          this.model.rotation.set(0, 0, 0)
          this.model.scale.set(1, 1, 1)
          this.updateControlValues()
        }

        remove() {
          if (this.model) {
            this.scene.remove(this.model)
            this.model = null
            this.hideControls()
            this.updateLoadingState('', '未加载')
          }
        }

        onMouseDown(event) {
          if (!this.model || !this.camera) return

          // 检查是否点击了模型
          const raycaster = new THREE.Raycaster()
          const mouse = new THREE.Vector2()

          mouse.x = (event.clientX / window.innerWidth) * 2 - 1
          mouse.y = -(event.clientY / window.innerHeight) * 2 + 1

          raycaster.setFromCamera(mouse, this.camera)
          const intersects = raycaster.intersectObject(this.model, true)

          if (intersects.length > 0) {
            this.isDragging = true
            this.previousMousePosition = {
              x: event.clientX,
              y: event.clientY
            }

            // 临时禁用轨道控制
            if (this.controls) {
              this.controls.enabled = false
            }
          }
        }

        onMouseMove(event) {
          if (!this.isDragging || !this.model) return

          const deltaMove = {
            x: event.clientX - this.previousMousePosition.x,
            y: event.clientY - this.previousMousePosition.y
          }

          // 根据鼠标移动调整模型位置
          this.model.position.x += deltaMove.x * 0.5
          this.model.position.y -= deltaMove.y * 0.5

          this.previousMousePosition = {
            x: event.clientX,
            y: event.clientY
          }

          this.updateControlValues()
        }

        onMouseUp() {
          this.isDragging = false

          // 重新启用轨道控制
          if (this.controls) {
            this.controls.enabled = true
          }
        }

        // UI相关方法
        updateLoadingState(text, status) {
          // 更新加载文本
          const loadingText = document.getElementById('loading-text')
          if (loadingText && text) {
            loadingText.textContent = text
          }

          // 更新模型状态
          const modelStatus = document.getElementById('model-status')
          if (modelStatus && status) {
            modelStatus.textContent = status
          }
        }

        showControls() {
          const controls = document.getElementById('model-controls')
          if (controls) {
            controls.style.display = 'block'
          }
        }

        hideControls() {
          const controls = document.getElementById('model-controls')
          if (controls) {
            controls.style.display = 'none'
          }
        }

        updateControlValues() {
          if (!this.model) return

          // 更新位置显示
          const posXValue = document.getElementById('pos-x-value')
          const posYValue = document.getElementById('pos-y-value')
          const posZValue = document.getElementById('pos-z-value')

          if (posXValue) posXValue.textContent = Math.round(this.model.position.x)
          if (posYValue) posYValue.textContent = Math.round(this.model.position.y)
          if (posZValue) posZValue.textContent = Math.round(this.model.position.z)

          // 更新旋转显示（转换为角度）
          const rotXValue = document.getElementById('rot-x-value')
          const rotYValue = document.getElementById('rot-y-value')
          const rotZValue = document.getElementById('rot-z-value')

          if (rotXValue) rotXValue.textContent = Math.round((this.model.rotation.x * 180) / Math.PI)
          if (rotYValue) rotYValue.textContent = Math.round((this.model.rotation.y * 180) / Math.PI)
          if (rotZValue) rotZValue.textContent = Math.round((this.model.rotation.z * 180) / Math.PI)

          // 更新缩放显示
          const scaleValue = document.getElementById('scale-value')
          if (scaleValue) scaleValue.textContent = this.model.scale.x.toFixed(1)
        }

        // 设置轨道控制器（用于拖放时临时禁用）
        setOrbitControls(controls) {
          this.controls = controls
        }

        // 销毁方法
        destroy() {
          this.remove()

          if (this.renderer && this.renderer.domElement) {
            this.renderer.domElement.removeEventListener('mousedown', this.onMouseDown)
            this.renderer.domElement.removeEventListener('mousemove', this.onMouseMove)
            this.renderer.domElement.removeEventListener('mouseup', this.onMouseUp)
          }
        }
      }
